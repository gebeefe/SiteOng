<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mundo Verde</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-container"></div>
    
    <div class="auth-container">
        <div class="auth-visual"></div>
        <div class="auth-form-wrap">
            <div class="auth-box reveal">
                <h2 class="auth-title">Acesse sua<br><span class="font-serif text-accent">Conta</span></h2>
                <p class="auth-subtitle">Bem-vindo de volta ao Mundo Verde.</p>
                
                <div id="mensagem-container"></div>
                
                <form id="form-login" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input class="form-control" type="email" id="email" name="email" placeholder="Seu email" required>
                    </div>
                    <div class="form-group">
                        <label for="senha" class="form-label">Senha</label>
                        <input class="form-control" type="password" id="senha" name="senha" placeholder="Sua senha" required>
                    </div>
                    <button class="btn-premium btn-submit" type="submit">Entrar</button>
                </form>
                
                <p style="margin-top: 2rem; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
                    Não tem uma conta? <a href="cadastro.html" style="color: var(--accent); text-decoration: none; font-weight: bold;">Cadastre-se aqui</a>
                </p>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const mensagemContainer = document.getElementById('mensagem-container');
            
            const usuario = StorageManager.getUserByEmail(email);
            
            if (!usuario) {
                mostrarMensagem('Email não encontrado. Verifique ou cadastre-se.', 'danger', mensagemContainer);
                return;
            }
            
            if (usuario.senha !== senha) {
                mostrarMensagem('Senha incorreta!', 'danger', mensagemContainer);
                return;
            }
            
            StorageManager.setCurrentUser(usuario.id, usuario.nome, usuario.email);
            mostrarMensagem('Login realizado com sucesso! Redirecionando...', 'success', mensagemContainer);
            
            setTimeout(() => {
                window.location.href = 'produtos.html';
            }, 1500);
        }
        
        function mostrarMensagem(mensagem, tipo, container) {
            container.innerHTML = `
                <div class="alert alert-${tipo}" style="margin-bottom: 1.5rem; text-align: center; font-size: 0.9rem;">
                    ${mensagem}
                </div>
            `;
        }
    </script>
</body>
</html>
